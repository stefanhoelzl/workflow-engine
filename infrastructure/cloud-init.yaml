#cloud-config

# Bootstrap minimum: enough for tofu to SSH in as `deploy` and converge
# everything else via the in-place mechanism. Anything that can be applied
# over SSH after first boot belongs in host.tf / apps.tf / caddy.tf, NOT here.
#
# Edits to this file STILL trigger VPS replacement because cloud-init runs
# only at first boot — but the surface that triggers replacement is now
# the bootstrap minimum (deploy user, sudoers, sshd port, ufw baseline,
# FORWARD policy), which changes rarely.

package_update: true

packages:
  - sudo
  - ufw

users:
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    # adm + systemd-journal grant read access to /var/log/journal so the
    # operator can `journalctl -u wfe-prod -u wfe-staging -u caddy` without
    # sudo.
    groups: [adm, systemd-journal]
    ssh_authorized_keys:
      - ${deploy_ssh_public_key}

write_files:
  # Broad NOPASSWD sudoers for deploy, scoped to the converge primitives
  # the in-place mechanism needs. Justified by the privilege-isolation
  # split: deploy is administrative-only; rootless container workloads run
  # as per-tenant `wfe-*` users (created by tofu, not by cloud-init), so a
  # post-S1/I11 attacker lands as `wfe-*` and cannot reach this allowlist.
  # See openspec/specs/host-security-baseline/spec.md
  # §"Privilege isolation: deploy administers; per-tenant wfe-* run unprivileged".
  # Sudoers content is shared with the in-place entry in host.tf
  # (managed_files_host.sudoers_deploy) — both render from the same source
  # file at infrastructure/files/sudoers_deploy. The convergence mechanism
  # overwrites this drop-in idempotently after first boot, allowing future
  # allowlist edits to apply in-place without VPS replacement.
  - path: /etc/sudoers.d/deploy
    content: |
${sudoers_deploy_content}
    permissions: "0440"
    owner: "root:root"

  # sshd hardening at first boot. Same source as the in-place entry in
  # host.tf (managed_files_host.sshd_hardening) — both render from
  # infrastructure/files/sshd_hardening.conf.tmpl. Future hardening edits
  # apply in-place via the convergence mechanism without VPS replacement.
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
${sshd_hardening_content}
    permissions: "0644"

runcmd:
  # Firewall baseline: default-deny inbound, allow only the configured SSH
  # port. App-side rules (80, 443) are added by `managed_ufw` in host.tf,
  # additive on top of this baseline. FORWARD=ACCEPT is required so that
  # rootless container egress (Caddy ACME, ghcr.io image pulls, DNS) can
  # traverse the Podman bridge. INPUT remains default-deny.
  - sed -i 's/^DEFAULT_FORWARD_POLICY=.*/DEFAULT_FORWARD_POLICY="ACCEPT"/' /etc/default/ufw
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw default allow routed
  - ufw allow ${ssh_port}/tcp
  - ufw --force enable

  # Restart sshd to pick up the new Port + hardening directives. Must come
  # AFTER ufw allows the new port, otherwise we lock ourselves out.
  - systemctl restart ssh
